<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>StoreTrak — Smart Shop Management &amp; POS</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d9488'/%3E%3Cpath d='M8 22v-9l8-5 8 5v9' stroke='white' stroke-width='2.5' fill='none'/%3E%3C/svg%3E">
    <style>
        :root {
            --t: #0d9488;
            --t2: #0f766e;
            --bg: #f2f6f6;
            --tx: #10292b;
            --mu: #6b8587;
            --bd: #e1eaea;
            --ok: #15803d;
            --wa: #b45309;
            --er: #b91c1c
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        body {
            font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--tx)
        }

        button,
        input,
        select {
            font: inherit;
            color: inherit
        }

        .hide {
            display: none !important
        }

        tr[hidden] {
            display: none
        }

        h2 {
            font-size: 24px;
            letter-spacing: -.02em
        }

        h3,
        h4 {
            font-weight: 650
        }

        .mu {
            color: var(--mu)
        }

        .sm {
            font-size: 12px
        }

        .ta-r {
            text-align: right
        }

        .ta-c {
            text-align: center
        }

        .er {
            color: var(--er)
        }

        .ok {
            color: var(--ok)
        }

        .row {
            display: flex;
            align-items: center
        }

        .g8 {
            gap: 8px
        }

        .wrap {
            flex-wrap: wrap
        }

        .end {
            justify-content: flex-end
        }

        .fx {
            flex: 1;
            min-width: 0
        }

        .mt {
            margin-top: 16px
        }

        .mt8 {
            margin-top: 8px
        }

        .sp {
            height: 1px;
            background: var(--bd);
            margin: 12px 0
        }

        .g2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px
        }

        .g2.s8 {
            gap: 10px
        }

        .g4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px
        }

        .span2 {
            grid-column: 1/-1
        }

        /* login */
        #login {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1.15fr 1fr
        }

        .hero {
            background: radial-gradient(circle at 15% 10%, #14b8a655, transparent 45%), radial-gradient(circle at 90% 90%, #0d948866, transparent 40%), linear-gradient(160deg, #0b1f21, #0f3b3a);
            color: #fff;
            padding: 64px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px
        }

        .hero h1 {
            font-size: 40px;
            line-height: 1.12;
            letter-spacing: -.03em;
            max-width: 480px
        }

        .hero p {
            opacity: .8;
            max-width: 440px;
            font-size: 16px
        }

        .hero li {
            list-style: none;
            padding: 7px 0;
            opacity: .92;
            display: flex;
            gap: 10px;
            align-items: center
        }

        .hero li svg {
            color: #5eead4
        }

        .lf {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            background: #fff
        }

        .lb2 {
            width: 100%;
            max-width: 360px;
            animation: up .5s
        }

        .lb2 h3 {
            font-size: 24px;
            margin-bottom: 4px
        }

        /* shell */
        .side {
            position: fixed;
            inset: 0 auto 0 0;
            width: 244px;
            background: linear-gradient(180deg, #0b1f21, #0d2b2c);
            color: #9fbcbc;
            padding: 18px 14px;
            display: flex;
            flex-direction: column;
            z-index: 30;
            transition: transform .25s;
            overflow: auto
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-weight: 750;
            font-size: 20px;
            letter-spacing: -.02em;
            padding: 2px 8px 16px
        }

        .brand.dk {
            color: var(--tx);
            padding: 0
        }

        .nav {
            flex: 1
        }

        .nav small {
            display: block;
            padding: 16px 12px 6px;
            font-size: 11px;
            letter-spacing: .1em;
            text-transform: uppercase;
            opacity: .45
        }

        .nav a {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 12px;
            border-radius: 10px;
            color: #9fbcbc;
            cursor: pointer;
            margin: 2px 0;
            transition: .18s;
            font-weight: 500
        }

        .nav a:hover {
            background: #ffffff14;
            color: #fff;
            transform: translateX(2px)
        }

        .nav a.on {
            background: linear-gradient(90deg, var(--t), #14b8a6);
            color: #fff;
            box-shadow: 0 8px 18px #0d948855
        }

        .main {
            margin-left: 244px;
            min-height: 100vh
        }

        .top {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #f2f6f6ee;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 28px;
            border-bottom: 1px solid var(--bd)
        }

        .top h3 {
            font-size: 16px
        }

        .user {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .user b {
            display: block;
            line-height: 1.1
        }

        .page {
            padding: 24px 28px 40px;
            animation: up .35s ease
        }

        @keyframes up {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .shade {
            position: fixed;
            inset: 0;
            background: #0007;
            z-index: 25;
            display: none
        }

        .shade.on {
            display: block
        }

        #mn {
            display: none
        }

        .ph {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 18px
        }

        /* parts */
        .card {
            background: #fff;
            border: 1px solid var(--bd);
            border-radius: 14px;
            box-shadow: 0 1px 3px #0a2a2c0d;
            transition: .2s
        }

        .pad {
            padding: 18px
        }

        .ch {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px
        }

        .ch h4 {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 8px 14px;
            border: 1px solid var(--bd);
            background: #fff;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 550;
            white-space: nowrap;
            text-decoration: none;
            transition: .15s
        }

        .btn:hover {
            border-color: var(--t);
            color: var(--t2);
            transform: translateY(-1px)
        }

        .btn.p {
            background: linear-gradient(135deg, #0d9488, #14b8a6);
            color: #fff;
            border: 0;
            box-shadow: 0 6px 14px #0d948844
        }

        .btn.p:hover {
            color: #fff;
            box-shadow: 0 8px 20px #0d948866
        }

        .btn.d {
            background: #dc2626;
            color: #fff;
            border: 0
        }

        .btn.d:hover {
            color: #fff
        }

        .btn.ok {
            background: #16a34a;
            color: #fff;
            border: 0
        }

        .btn.ok:hover {
            color: #fff
        }

        .btn.sm {
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 8px
        }

        .btn.lg {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            margin-top: 14px
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none
        }

        .ib {
            border: 0;
            background: none;
            padding: 6px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--mu);
            display: inline-flex
        }

        .ib:hover {
            background: #eef4f4;
            color: var(--t2)
        }

        .ib.dn:hover {
            background: #fee2e2;
            color: var(--er)
        }

        .in {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #d3e0e0;
            border-radius: 10px;
            background: #fff;
            outline: 0;
            transition: .15s
        }

        .in:focus {
            border-color: var(--t);
            box-shadow: 0 0 0 3px #14b8a62e
        }

        .lb {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--mu);
            margin: 0 0 5px
        }

        .sr {
            position: relative;
            min-width: 240px
        }

        .sr svg {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--mu)
        }

        .sr .in {
            padding-left: 36px
        }

        .sr.big .in {
            padding: 13px 14px 13px 42px;
            font-size: 15px;
            border-radius: 12px
        }

        .sr.big {
            margin-bottom: 14px
        }

        .tw {
            overflow-x: auto
        }

        .tbl {
            width: 100%;
            border-collapse: collapse
        }

        .tbl th {
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--mu);
            padding: 12px 16px;
            background: #f8fbfb;
            border-bottom: 1px solid var(--bd);
            white-space: nowrap
        }

        .tbl td {
            padding: 12px 16px;
            border-bottom: 1px solid #eef3f3;
            vertical-align: middle
        }

        .tbl tbody tr {
            transition: .12s
        }

        .tbl tbody tr:hover {
            background: #f6fbfa
        }

        .act {
            text-align: right;
            white-space: nowrap
        }

        .bd {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600;
            background: #dcfce7;
            color: var(--ok)
        }

        .bd.wa {
            background: #fef3c7;
            color: var(--wa)
        }

        .bd.er {
            background: #fee2e2;
            color: var(--er)
        }

        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px
        }

        .chip {
            background: #e6f4f2;
            color: var(--t2);
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600
        }

        .chip.wa {
            background: #fef3c7;
            color: var(--wa)
        }

        .av {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px
        }

        .av.sm {
            width: 32px;
            height: 32px;
            font-size: 14px;
            border-radius: 9px
        }

        .wh {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .empty {
            text-align: center;
            padding: 36px 16px;
            color: var(--mu)
        }

        .empty svg {
            opacity: .45;
            margin-bottom: 6px
        }

        .empty h4 {
            color: var(--tx);
            margin-bottom: 2px
        }

        .empty.sm {
            padding: 18px
        }

        .tabs {
            display: inline-flex;
            background: #e4eded;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px
        }

        .tabs button {
            border: 0;
            background: none;
            padding: 7px 16px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
            color: var(--mu)
        }

        .tabs button.on {
            background: #fff;
            color: var(--t2);
            box-shadow: 0 1px 4px #0002
        }

        /* stats */
        .stat {
            display: flex;
            gap: 14px;
            align-items: center;
            padding: 18px
        }

        .stat:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px #0a2a2c1a
        }

        .si {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none
        }

        .sv {
            font-size: 22px;
            font-weight: 750;
            letter-spacing: -.02em
        }

        .c1 .si {
            background: #ccfbf1;
            color: #0f766e
        }

        .c2 .si {
            background: #dbeafe;
            color: #1d4ed8
        }

        .c3 .si {
            background: #dcfce7;
            color: #15803d
        }

        .c4 .si {
            background: #fee2e2;
            color: #b91c1c
        }

        .bars {
            display: flex;
            gap: 12px;
            height: 230px;
            padding-top: 6px
        }

        .bc {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px
        }

        .bw {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center
        }

        .bar {
            width: 100%;
            max-width: 48px;
            border-radius: 8px 8px 3px 3px;
            background: linear-gradient(180deg, #2dd4bf, #0d9488);
            transform-origin: bottom;
            animation: grow .8s cubic-bezier(.2, .8, .2, 1) both
        }

        .bc:hover .bar {
            filter: brightness(1.12)
        }

        @keyframes grow {
            from {
                transform: scaleY(0)
            }
        }

        .bv {
            font-size: 11px;
            font-weight: 600;
            color: var(--t2);
            min-height: 16px
        }

        .bl {
            font-size: 11px;
            color: var(--mu);
            white-space: nowrap
        }

        .li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #eef3f3
        }

        .li:last-child {
            border: 0
        }

        .li.tot {
            font-weight: 700;
            background: #f4fbfa;
            margin: 0 -18px;
            padding: 10px 18px
        }

        .rk {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: #e6f4f2;
            color: var(--t2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px
        }

        /* POS */
        .pos {
            display: grid;
            grid-template-columns: 1fr 390px;
            gap: 18px;
            align-items: start
        }

        .pg {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px
        }

        .pt {
            background: #fff;
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 14px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: .18s
        }

        .pt:hover {
            border-color: var(--t);
            transform: translateY(-3px);
            box-shadow: 0 10px 22px #0d948826
        }

        .pt.off {
            opacity: .5
        }

        .pp {
            font-weight: 750;
            color: var(--t2);
            font-size: 16px
        }

        .cart {
            position: sticky;
            top: 76px
        }

        .ci {
            max-height: 300px;
            overflow: auto
        }

        .cl {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px solid #eef3f3
        }

        .qt {
            display: flex;
            align-items: center;
            border: 1px solid #d3e0e0;
            border-radius: 9px;
            overflow: hidden
        }

        .qt button {
            border: 0;
            background: #f4f8f8;
            width: 26px;
            height: 30px;
            cursor: pointer;
            font-size: 16px
        }

        .qt button:hover {
            background: #dff3f0
        }

        .qt input {
            width: 44px;
            border: 0;
            text-align: center;
            outline: 0;
            height: 30px
        }

        .lt {
            min-width: 84px;
            text-align: right
        }

        .tl {
            display: grid;
            gap: 6px
        }

        .tl>div {
            display: flex;
            justify-content: space-between
        }

        .tl .gt {
            font-size: 18px;
            font-weight: 750;
            border-top: 1px dashed #cfdede;
            padding-top: 8px;
            margin-top: 2px
        }

        .pr {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center
        }

        /* modal / toast */
        .ov {
            position: fixed;
            inset: 0;
            background: #06181acc;
            backdrop-filter: blur(3px);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px
        }

        .ov.on {
            display: flex;
            animation: fade .2s
        }

        .md {
            background: #fff;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            max-height: 92vh;
            overflow: auto;
            box-shadow: 0 30px 70px #0006;
            animation: pop .22s
        }

        .md.wd {
            max-width: 640px
        }

        .mh {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--bd)
        }

        .mb {
            padding: 20px
        }

        @keyframes fade {
            from {
                opacity: 0
            }
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: scale(.94) translateY(10px)
            }
        }

        #toasts {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 80;
            display: grid;
            gap: 8px
        }

        .toast {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 12px 16px;
            border-radius: 12px;
            color: #fff;
            box-shadow: 0 12px 30px #0004;
            animation: slide .3s;
            max-width: 360px
        }

        .toast.ok {
            background: #0f766e
        }

        .toast.er {
            background: #b91c1c
        }

        .toast.out {
            opacity: 0;
            transform: translateX(30px);
            transition: .35s
        }

        @keyframes slide {
            from {
                opacity: 0;
                transform: translateX(40px)
            }
        }

        .ih {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid var(--t);
            padding-bottom: 12px
        }

        .ih h3 {
            color: var(--t2);
            letter-spacing: .1em
        }

        .inv .tl {
            margin-left: auto;
            max-width: 260px;
            margin-top: 14px
        }

        @media(max-width:1100px) {
            .g4 {
                grid-template-columns: 1fr 1fr
            }

            .pos {
                grid-template-columns: 1fr
            }

            .cart {
                position: static
            }
        }

        @media(max-width:900px) {
            #login {
                grid-template-columns: 1fr
            }

            .hero {
                display: none
            }

            .side {
                transform: translateX(-100%)
            }

            .side.open {
                transform: none
            }

            .main {
                margin-left: 0
            }

            #mn {
                display: inline-flex
            }

            .g2 {
                grid-template-columns: 1fr
            }

            .page {
                padding: 18px 14px
            }

            .top {
                padding: 10px 14px
            }

            .pr {
                grid-template-columns: 1fr 1fr
            }

            .user div {
                display: none
            }
        }

        @media(max-width:560px) {
            .g4 {
                grid-template-columns: 1fr
            }

            .sr {
                min-width: 0;
                width: 100%
            }
        }

        @media print {
            body * {
                visibility: hidden
            }

            .pa,
            .pa * {
                visibility: visible
            }

            .pa {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%
            }

            .ov,
            .md {
                position: static !important;
                background: none !important;
                box-shadow: none !important;
                max-height: none !important;
                overflow: visible !important
            }
        }
    </style>
</head>

<body>
    <div id="login">
        <div class="hero">
            <div class="brand"><span class="logo"></span>StoreTrak</div>
            <h1>Run your whole shop from one smart screen.</h1>
            <p>Billing, stock, suppliers, udhaar and profit reports — all connected, all in real time.</p>
            <ul id="feat"></ul>
        </div>
        <div class="lf">
            <div class="lb2">
                <div class="brand dk" style="padding:0 0 22px"><span class="logo"></span>StoreTrak</div>
                <h3>Welcome back</h3>
                <p class="mu" style="margin-bottom:22px">Sign in to manage your store.</p>
                <label class="lb">Username</label><input id="u" class="in" autocomplete="username"><label
                    class="lb mt8">Password</label><input id="p" type="password" class="in"
                    autocomplete="current-password" onkeydown="if(event.key=='Enter')A.login()">
                <button id="lb" class="btn p lg" onclick="A.login()">Sign in</button>
                <div id="le" class="er sm mt8"></div>
                <p class="mu sm mt">Demo accounts: admin / admin123 · cashier / cashier123</p>
            </div>
        </div>
    </div>
    <div id="app" class="hide">
        <div id="sh" class="shade" onclick="A.menu()"></div>
        <aside id="side" class="side">
            <div class="brand"><span class="logo"></span>StoreTrak</div>
            <div id="nav" class="nav"></div>
            <div class="nav"><a onclick="A.logout()"></a></div>
        </aside>
        <div class="main">
            <div class="top"><button id="mn" class="ib" onclick="A.menu()"></button>
                <h3 id="pt" class="fx"></h3><span id="dt" class="mu sm"></span>
                <div class="user">
                    <div class="av sm" id="uav" style="background:var(--t)"></div>
                    <div><b id="un"></b><span id="ur" class="mu sm"></span></div>
                </div>
            </div>
            <div id="view" class="page"></div>
        </div>
    </div>
    <div id="ov" class="ov" onclick="if(event.target==this)A.close()">
        <div id="md" class="md">
            <div class="mh">
                <h4 id="mt"></h4><button class="ib" onclick="A.close()" id="mx"></button>
            </div>
            <div class="mb" id="mb"></div>
        </div>
    </div>
    <div id="toasts"></div>
    <script>
        const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
        const money = n => "Rs. " + (+n || 0).toLocaleString("en-US", { maximumFractionDigits: 2 });
        const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        const IC = { dash: '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>', pos: '<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/>', box: '<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>', tag: '<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/>', truck: '<path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>', inbox: '<path d="M4 13l3-8h10l3 8v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/>', users: '<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14c2.5.8 4 2.7 4 6"/>', wallet: '<path d="M3 7h16a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M3 7l2-3h12v3M16 14h3"/>', chart: '<path d="M4 20V4M4 20h16"/><path d="M8 16v-5M12 16V8M16 16v-8"/>', history: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', out: '<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>', search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>', plus: '<path d="M12 5v14M5 12h14"/>', warn: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>', print: '<path d="M7 9V3h10v6M7 17H4v-7h16v7h-3"/><rect x="7" y="14" width="10" height="7"/>', menu: '<path d="M4 6h16M4 12h16M4 18h16"/>', trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>', edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>', download: '<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>', check: '<path d="M5 12l5 5 9-10"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>' };
        const ic = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
        const LOGO = '<svg width="34" height="34" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#14b8a6"/><path d="M9 22v-9l7-4 7 4v9M13 22v-5h6v5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
        $$(".logo").forEach(e => e.innerHTML = LOGO); $("#feat").innerHTML = ["Fast POS billing with barcode search", "Automatic stock updates on every sale", "Udhaar &amp; supplier balance tracking", "Daily profit &amp; loss at a glance"].map(t => `<li>${ic("check", 18)}${t}</li>`).join("");
        $("#mn").innerHTML = ic("menu", 22); $("#mx").innerHTML = ic("x", 18); $("#nav+div a").innerHTML = ic("out") + "<span>Sign out</span>";
        const A = {}; let T = localStorage.st_t, ROLE = localStorage.st_r, USER = localStorage.st_u || "", ROWS = [], PR = [], CART = [], CUS = [], SALES = [], PL = [], PER = "day", ASK = null, PAGE = "", PAYT = [];
        const PERLBL = { day: "today", week: "the last 7 days", month: "the last 30 days", year: "the last 12 months" };
        const hue = s => `hsl(${[...s].reduce((a, c) => a + c.charCodeAt(0), 0) * 37 % 360} 52% 42%)`;
        const empty = (h, p, i = "box") => `<div class="empty">${ic(i, 34)}<h4>${h}</h4><p>${p}</p></div>`;
        function toast(t, ok = 1) { const e = document.createElement("div"); e.className = "toast " + (ok ? "ok" : "er"); e.innerHTML = ic(ok ? "check" : "warn", 18) + `<span>${esc(t)}</span>`; $("#toasts").append(e); setTimeout(() => e.classList.add("out"), 3300); setTimeout(() => e.remove(), 3700) }
        async function api(p, m = "GET", b) {
            const r = await fetch("/api/" + p, { method: m, headers: { "Content-Type": "application/json", Authorization: "Bearer " + T }, body: b ? JSON.stringify(b) : undefined }); const j = await r.json().catch(() => ({}));
            if (r.status == 401 && T) { A.logout(); throw Error("Session expired, please sign in again") } if (!r.ok) throw Error(typeof j.detail == "string" ? j.detail : "Something went wrong, please check the values entered"); return j
        }
        function modal(t, h, w) { $("#mt").textContent = t; $("#mb").innerHTML = h; $("#md").className = "md" + (w ? " wd" : ""); $("#ov").classList.add("on") }
        const ask = (t, m, b) => new Promise(r => { ASK = r; modal(t, `<p class="mu">${m}</p><div class="row g8 end mt"><button class="btn" onclick="A.ans(false)">Cancel</button><button class="btn d" onclick="A.ans(true)">${b}</button></div>`) });
        function count() { $$(".cnt").forEach(e => { const v = +e.dataset.v, t0 = performance.now(), f = t => { const p = Math.min(1, (t - t0) / 700); e.textContent = money(v * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(f) }; requestAnimationFrame(f); setTimeout(() => e.textContent = money(v), 900) }) }
        /* auth + shell */
        const NAV = [["Overview"], ["dash", "Dashboard", "dash", 1, () => A.dash()], ["pos", "POS Billing", "pos", 0, () => A.pos()], ["sales", "Sales History", "history", 0, () => A.sales()], ["Inventory"], ["products", "Products", "box", 0, () => A.crud("products")], ["categories", "Categories", "tag", 1, () => A.crud("categories")], ["purchases", "Purchases", "inbox", 1, () => A.purchases()], ["suppliers", "Suppliers", "truck", 1, () => A.crud("suppliers")], ["Finance"], ["customers", "Customers & Udhaar", "users", 0, () => A.crud("customers")], ["expenses", "Expenses", "wallet", 1, () => A.crud("expenses")], ["reports", "Reports & Export", "chart", 1, () => A.reports()]];
        A.login = async () => { const b = $("#lb"); b.disabled = true; $("#le").textContent = ""; try { const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: $("#u").value, password: $("#p").value }) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw Error(j.detail || "Could not sign in"); T = j.token; ROLE = j.role; USER = j.user; localStorage.st_t = T; localStorage.st_r = ROLE; localStorage.st_u = USER; A.start() } catch (e) { $("#le").textContent = e.message } b.disabled = false };
        A.logout = () => { ["st_t", "st_r", "st_u"].forEach(k => localStorage.removeItem(k)); location.reload() };
        A.menu = () => { $("#side").classList.toggle("open"); $("#sh").classList.toggle("on") };
        A.start = () => {
            $("#login").classList.add("hide"); $("#app").classList.remove("hide"); let h = "", pend = "";
            NAV.forEach(n => { if (n.length == 1) { pend = n[0]; return } if (n[3] && ROLE != "admin") return; if (pend) { h += `<small>${pend}</small>`; pend = "" } h += `<a data-k="${n[0]}" onclick="A.go('${n[0]}')">${ic(n[2])}<span>${n[1]}</span></a>` });
            $("#nav").innerHTML = h; $("#uav").textContent = (USER || "U")[0].toUpperCase(); $("#un").textContent = USER; $("#ur").textContent = ROLE; $("#dt").textContent = new Date().toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" }); A.go(ROLE == "admin" ? "dash" : "pos")
        };
        A.go = k => { const n = NAV.find(x => x[0] == k); PAGE = k; $$("#nav a").forEach(a => a.classList.toggle("on", a.dataset.k == k)); $("#pt").textContent = n[1]; $("#side").classList.remove("open"); $("#sh").classList.remove("on"); return n[4]() };
        A.close = () => { $("#ov").classList.remove("on"); if (ASK) { const f = ASK; ASK = null; f(false) } }; A.ans = v => { const f = ASK; ASK = null; $("#ov").classList.remove("on"); f && f(v) };
        document.addEventListener("keydown", e => { if (e.key == "Escape") A.close() });
        /* generic CRUD pages */
        const low = r => r.stock <= r.min_stock, chip = (t, k = "") => `<span class="chip ${k}">${t}</span>`, sumOf = (R, k) => R.reduce((a, r) => a + (+r[k] || 0), 0);
        const stk = r => r.stock <= 0 ? '<span class="bd er">Out of stock</span>' : low(r) ? `<span class="bd wa">Low · ${r.stock} ${esc(r.unit || "")}</span>` : `<span class="bd ok">${r.stock} ${esc(r.unit || "")}</span>`;
        const bal = r => r.balance > 0 ? `<span class="bd er">Due ${money(r.balance)}</span>` : '<span class="bd ok">Settled</span>';
        const who = r => `<div class="wh"><div class="av sm" style="background:${hue(r.name)}">${esc(r.name[0].toUpperCase())}</div><b>${esc(r.name)}</b></div>`;
        const S = {
            products: {
                t: "Products", one: "Product", sub: "Your merchandise, prices and stock levels", ico: "box", def: { unit: "pcs", min_stock: 10 }, f: [["name", "Product name"], ["barcode", "Barcode / SKU"], ["category", "Category", "cats"], ["unit", "Unit (pcs, kg, box…)"], ["buy_price", "Purchase price", "n"], ["sell_price", "Selling price", "n"], ["stock", "Opening stock", "n"], ["min_stock", "Low-stock alert level", "n"], ["description", "Description"]],
                cols: [["Product", r => `<b>${esc(r.name)}</b><div class="mu sm">${esc(r.barcode || "No barcode")}</div>`], ["Category", r => r.category ? chip(esc(r.category)) : "—"], ["Buy", r => money(r.buy_price)], ["Sell", r => `<b>${money(r.sell_price)}</b>`], ["Margin", r => r.sell_price > 0 ? Math.round((r.sell_price - r.buy_price) / r.sell_price * 100) + "%" : "—"], ["Stock", stk]],
                sum: R => chip(R.length + " products") + chip(R.filter(low).length + " need restocking", "wa") + chip("Stock value " + money(R.reduce((a, r) => a + r.stock * r.buy_price, 0)))
            },
            categories: { t: "Categories", one: "Category", sub: "Group your products", ico: "tag", f: [["name", "Category name"]], cols: [["Category", r => `<b>${esc(r.name)}</b>`]] },
            suppliers: { t: "Suppliers", one: "Supplier", sub: "Who you buy stock from, and what you owe them", ico: "truck", pay: "Pay supplier", f: [["name", "Supplier name"], ["phone", "Phone"]], cols: [["Supplier", who], ["Phone", r => esc(r.phone || "—")], ["Balance", bal]], sum: R => chip(R.length + " suppliers") + chip("You owe " + money(sumOf(R, "balance")), "wa") },
            customers: { t: "Customers & Udhaar", one: "Customer", sub: "Customer profiles and credit balances", ico: "users", pay: "Receive payment", f: [["name", "Customer name"], ["phone", "Phone"]], cols: [["Customer", who], ["Phone", r => esc(r.phone || "—")], ["Balance", bal]], sum: R => chip(R.length + " customers") + chip("Udhaar outstanding " + money(sumOf(R, "balance")), "wa") },
            expenses: { t: "Expenses", one: "Expense", sub: "Rent, electricity, salaries and other costs", ico: "wallet", f: [["title", "Expense title (rent, electricity…)"], ["amount", "Amount", "n"]], cols: [["Expense", r => `<b>${esc(r.title)}</b>`], ["Date", r => (r.date || "").slice(0, 10)], ["Amount", r => `<b>${money(r.amount)}</b>`]], sum: R => chip(R.length + " entries") + chip("Total " + money(sumOf(R, "amount"))) }
        };
        const rowHtml = (t, r) => { const C = S[t]; return `<tr>${C.cols.map(c => `<td>${c[1](r)}</td>`).join("")}<td class="act">${C.pay && r.balance > 0 ? `<button class="btn sm ok" onclick="A.payDlg('${t}',${r.id})">${C.pay}</button> ` : ""}${ROLE == "admin" ? `<button class="ib" title="Edit" onclick="A.openForm('${t}',${r.id})">${ic("edit", 16)}</button><button class="ib dn" title="Delete" onclick="A.del('${t}',${r.id})">${ic("trash", 16)}</button>` : ""}</td></tr>` };
        A.crud = async t => {
            const C = S[t]; ROWS = await api("r/" + t); const ro = ROLE != "admin" && t != "customers";
            $("#view").innerHTML = `<div class="ph"><div><h2>${C.t}</h2><p class="mu">${C.sub}</p></div><div class="row g8 wrap"><div class="sr">${ic("search", 16)}<input class="in" placeholder="Search ${C.t.toLowerCase()}…" oninput="A.filt(this.value)"></div>${ro ? "" : `<button class="btn p" onclick="A.openForm('${t}')">${ic("plus", 16)}Add ${C.one.toLowerCase()}</button>`}</div></div>${C.sum ? `<div class="chips">${C.sum(ROWS)}</div>` : ""}<div class="card tw"><table class="tbl"><thead><tr>${C.cols.map(c => `<th>${c[0]}</th>`).join("")}<th></th></tr></thead><tbody id="tb">${ROWS.map(r => rowHtml(t, r)).join("") || `<tr><td colspan="9">${empty("No " + C.t.toLowerCase() + " yet", ro ? "Nothing to show here." : "Click the Add button to create your first record.", C.ico)}</td></tr>`}</tbody></table></div>`
        };
        A.filt = q => $$("#tb tr").forEach(r => r.hidden = !r.textContent.toLowerCase().includes(q.toLowerCase()));
        A.openForm = async (t, id) => {
            const C = S[t], r = id ? ROWS.find(x => x.id == id) : (C.def || {}), cats = t == "products" ? await api("r/categories") : [];
            modal((id ? "Edit " : "Add ") + C.one.toLowerCase(), `<div class="g2 s8">${C.f.map(([k, l, ty]) => `<div class="${k == "description" ? "span2" : ""}"><label class="lb">${l}</label><input class="in" id="f_${k}" value="${esc(r[k] ?? "")}" ${ty == "n" ? 'type="number" min="0" step="any"' : ""} ${ty == "cats" ? 'list="dl"' : ""}></div>`).join("")}</div><datalist id="dl">${cats.map(c => `<option value="${esc(c.name)}">`).join("")}</datalist><div class="row g8 end mt"><button class="btn" onclick="A.close()">Cancel</button><button class="btn p" onclick="A.save('${t}',${id || 0})">Save</button></div>`, 1); setTimeout(() => $("#f_" + C.f[0][0]).focus(), 50)
        };
        A.save = async (t, id) => { const C = S[t], b = {}; C.f.forEach(([k]) => b[k] = $("#f_" + k).value.trim()); if (!b[C.f[0][0]]) throw Error(C.f[0][1] + " is required"); await api("r/" + t + (id ? "/" + id : ""), id ? "PUT" : "POST", b); A.close(); toast(C.one + (id ? " updated" : " added")); A.crud(t) };
        A.del = async (t, id) => { if (!await ask("Delete this record?", "This cannot be undone.", "Delete")) return; await api(`r/${t}/${id}`, "DELETE"); toast("Deleted"); A.crud(t) };
        A.payDlg = (t, id) => { const r = ROWS.find(x => x.id == id); PAYT = [t, id]; modal(S[t].pay + " — " + r.name, `<p class="mu">Outstanding balance: <b>${money(r.balance)}</b></p><label class="lb mt8">Amount</label><input id="pa" class="in" type="number" min="0" step="any" value="${r.balance}"><div class="row g8 end mt"><button class="btn" onclick="A.close()">Cancel</button><button class="btn p" onclick="A.doPay()">Record payment</button></div>`) };
        A.doPay = async () => { await api(`pay/${PAYT[0]}/${PAYT[1]}`, "POST", { amount: $("#pa").value }); A.close(); toast("Payment recorded"); A.crud(PAYT[0]) };
        /* invoice */
        const invHtml = v => `<div class="pa inv"><div class="ih"><div><div class="brand dk"><span>${LOGO}</span>StoreTrak</div><div class="mu sm">Smart Shop Management &amp; POS</div></div><div class="ta-r"><h3>INVOICE</h3><b>#${String(v.id).padStart(5, "0")}</b><div class="mu sm">${v.date}</div></div></div><div class="mt">Billed to: <b>${esc(v.customer || "Walk-in customer")}</b>${v.status == "returned" ? ' <span class="bd er">RETURNED</span>' : ""}</div><table class="tbl mt"><thead><tr><th>Item</th><th>Qty</th><th>Price</th><th class="ta-r">Total</th></tr></thead><tbody>${v.items.map(i => `<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td class="ta-r">${money(i.qty * i.price)}</td></tr>`).join("")}</tbody></table><div class="tl"><div><span>Subtotal</span><b>${money(v.subtotal)}</b></div><div><span>Discount</span><b>− ${money(v.discount)}</b></div><div class="gt"><span>Total</span><b>${money(v.total)}</b></div><div><span>Paid</span><b>${money(v.paid)}</b></div><div><span>Balance due</span><b class="${v.due > 0.005 ? "er" : ""}">${money(v.due)}</b></div></div><p class="mu sm ta-c mt">Thank you for shopping with us!</p></div><div class="row g8 end mt"><button class="btn" onclick="A.close()">Close</button><button class="btn p" onclick="print()">${ic("print", 16)}Print / Save PDF</button></div>`;
        /* POS */
        A.pos = async () => {
            [PR, CUS] = await Promise.all([api("r/products"), api("r/customers")]); CART = [];
            $("#view").innerHTML = `<div class="pos"><div><div class="sr big">${ic("search", 18)}<input id="q" class="in" placeholder="Search by name or scan a barcode, then press Enter" oninput="A.grid()" onkeydown="if(event.key=='Enter')A.scan()"></div><div class="pg" id="grid"></div></div><div class="card pad cart"><div class="ch"><h4>${ic("pos", 18)} Current order</h4><button class="btn sm" onclick="A.clear()">Clear</button></div><div id="cart" class="ci"></div><div class="sp"></div><label class="lb">Customer</label><select id="cu" class="in"><option value="">Walk-in customer</option>${CUS.map(c => `<option value="${c.id}">${esc(c.name)}${c.balance > 0 ? " — due " + money(c.balance) : ""}</option>`).join("")}</select><div class="g2 s8 mt8"><div><label class="lb">Discount</label><input id="di" class="in" type="number" min="0" value="0" oninput="A.tot()"></div><div><label class="lb">Amount paid</label><input id="pd" class="in" type="number" min="0" placeholder="Full amount" oninput="A.tot()"></div></div><div class="row g8 mt8"><button class="btn sm" onclick="A.setpaid(0)">Paid in full</button><button class="btn sm" onclick="A.setpaid(1)">On credit (udhaar)</button></div><div class="tl mt"><div><span>Subtotal</span><b id="st"></b></div><div><span>Discount</span><b id="ds"></b></div><div class="gt"><span>Total</span><b id="tt"></b></div><div id="du" class="er sm"></div></div><button id="cb" class="btn p lg" onclick="A.checkout()">Complete sale</button></div></div>`; A.grid(); A.draw(); $("#q").focus()
        };
        A.grid = () => { const q = $("#q").value.toLowerCase(); $("#grid").innerHTML = PR.filter(p => (p.name + " " + (p.barcode || "") + " " + (p.category || "")).toLowerCase().includes(q)).slice(0, 60).map(p => { const o = p.stock <= 0; return `<div class="pt ${o ? "off" : ""}" onclick="A.add(${p.id})"><div class="av" style="background:${hue(p.name)}">${esc(p.name[0].toUpperCase())}</div><b>${esc(p.name)}</b><div class="pp">${money(p.sell_price)}</div><span class="bd ${o ? "er" : low(p) ? "wa" : "ok"}">${o ? "Out of stock" : p.stock + " " + esc(p.unit || "")}</span></div>` }).join("") || `<div class="span2">${empty(PR.length ? "No match" : "No products yet", PR.length ? "Try another name or barcode." : "Add products first from the Products page.")}</div>` };
        A.scan = () => { const q = $("#q").value.trim().toLowerCase(); if (!q) return; let p = PR.find(x => (x.barcode || "").toLowerCase() == q); if (!p) { const L = PR.filter(x => x.name.toLowerCase().includes(q)); if (L.length == 1) p = L[0] } if (p) { A.add(p.id); $("#q").value = ""; A.grid() } else toast("No product matches that barcode", 0) };
        A.add = id => { const p = PR.find(x => x.id == id); if (p.stock <= 0) return toast(p.name + " is out of stock", 0); const c = CART.find(x => x.id == id); if (c) { if (c.qty + 1 > p.stock) return toast("Only " + p.stock + " " + (p.unit || "") + " of " + p.name + " in stock", 0); c.qty++ } else CART.push({ id, name: p.name, price: p.sell_price, qty: 1, max: p.stock }); A.draw() };
        A.qty = (i, d) => { const c = CART[i], n = c.qty + d; if (n < 1) return A.rm(i); if (n > c.max) return toast("Only " + c.max + " in stock", 0); c.qty = n; A.draw() };
        A.setq = (i, v) => { const c = CART[i]; v = +v; if (!(v > 0)) return A.draw(); if (v > c.max) { toast("Only " + c.max + " in stock", 0); v = c.max } c.qty = v; A.draw() };
        A.rm = i => { CART.splice(i, 1); A.draw() }; A.clear = () => { CART = []; A.draw() };
        A.draw = () => { $("#cart").innerHTML = CART.map((c, i) => `<div class="cl"><div class="fx"><b>${esc(c.name)}</b><div class="mu sm">${money(c.price)} each</div></div><div class="qt"><button onclick="A.qty(${i},-1)">−</button><input type="number" step="any" min="0" value="${c.qty}" onchange="A.setq(${i},this.value)"><button onclick="A.qty(${i},1)">+</button></div><b class="lt">${money(c.qty * c.price)}</b><button class="ib" onclick="A.rm(${i})">${ic("trash", 16)}</button></div>`).join("") || `<div class="empty sm">${ic("pos", 30)}<p>Click a product to add it to the order</p></div>`; A.tot() };
        A.tot = () => { const sub = CART.reduce((a, c) => a + c.qty * c.price, 0), di = Math.min(Math.max(+$("#di").value || 0, 0), sub), t = sub - di, pv = $("#pd").value, pd = pv === "" ? t : Math.min(Math.max(+pv, 0), t); $("#st").textContent = money(sub); $("#ds").textContent = "− " + money(di); $("#tt").textContent = money(t); $("#du").textContent = pd < t - 0.005 ? "Udhaar to record: " + money(t - pd) : ""; $("#cb").disabled = !CART.length };
        A.setpaid = c => { $("#pd").value = c ? 0 : ""; A.tot() };
        A.checkout = async () => { if (!CART.length) return toast("Add at least one product", 0); const b = $("#cb"); b.disabled = true; try { const v = await api("sales", "POST", { items: CART.map(c => ({ product_id: c.id, qty: c.qty })), customer_id: $("#cu").value || null, discount: $("#di").value || 0, paid: $("#pd").value }); modal("Sale completed", invHtml(v), 1); toast("Sale #" + v.id + " completed"); await A.pos() } catch (e) { b.disabled = false; throw e } };
        /* sales history */
        A.sales = async () => { SALES = await api("sales"); $("#view").innerHTML = `<div class="ph"><div><h2>Sales History</h2><p class="mu">Every invoice — view, reprint or return a sale</p></div><div class="sr">${ic("search", 16)}<input class="in" placeholder="Search invoices…" oninput="A.filt(this.value)"></div></div><div class="card tw"><table class="tbl"><thead><tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Paid</th><th>Status</th><th></th></tr></thead><tbody id="tb">${SALES.map(s => `<tr><td><b>#${s.id}</b></td><td>${s.date}</td><td>${esc(s.customer || "Walk-in")}</td><td>${s.items.length}</td><td><b>${money(s.total)}</b></td><td>${money(s.paid)}</td><td>${s.status == "returned" ? '<span class="bd er">Returned</span>' : s.due > 0.005 ? `<span class="bd wa">Due ${money(s.due)}</span>` : '<span class="bd ok">Paid</span>'}</td><td class="act"><button class="btn sm" onclick="A.view(${s.id})">View</button>${ROLE == "admin" && s.status != "returned" ? ` <button class="btn sm d" onclick="A.ret(${s.id})">Return</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="8">${empty("No sales yet", "Completed sales appear here.", "history")}</td></tr>`}</tbody></table></div>` };
        A.view = id => modal("Invoice #" + id, invHtml(SALES.find(s => s.id == id)), 1);
        A.ret = async id => { if (!await ask("Return this sale?", "Stock goes back to inventory and any udhaar on this invoice is cleared.", "Return sale")) return; await api(`sales/${id}/return`, "POST"); toast("Sale returned, stock restored"); A.sales() };
        /* purchases */
        A.purchases = async () => {
            const [sp, pr, hist] = await Promise.all([api("r/suppliers"), api("r/products"), api("purchases")]); PL = pr; const none = !sp.length || !pr.length;
            $("#view").innerHTML = `<div class="ph"><div><h2>Purchases</h2><p class="mu">Record stock bought from suppliers — inventory updates automatically</p></div></div><div class="g2"><div class="card pad"><div class="ch"><h4>New purchase</h4></div>${none ? empty("Set things up first", (sp.length ? "" : "Add a supplier. ") + (pr.length ? "" : "Add a product."), "inbox") : `<label class="lb">Supplier</label><select id="sp" class="in">${sp.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select><label class="lb mt8">Items</label><div id="pl"></div><button class="btn sm" onclick="A.prow()">${ic("plus", 14)} Add item</button><div class="g2 s8 mt"><div><label class="lb">Paid to supplier now</label><input id="pp" class="in" type="number" min="0" value="0"></div><div class="tl"><div class="gt"><span>Total</span><b id="ptot">Rs. 0</b></div></div></div><button class="btn p lg" onclick="A.buy()">Save purchase &amp; update stock</button>`}</div><div class="card tw"><div class="pad"><h4>Recent purchases</h4></div><table class="tbl"><thead><tr><th>#</th><th>Date</th><th>Supplier</th><th>Total</th><th>Paid</th></tr></thead><tbody>${hist.map(h => `<tr><td>#${h.id}</td><td>${h.date}</td><td>${esc(h.supplier)}</td><td><b>${money(h.total)}</b></td><td>${money(h.paid)}</td></tr>`).join("") || `<tr><td colspan="5">${empty("No purchases yet", "Saved purchases appear here.", "inbox")}</td></tr>`}</tbody></table></div></div>`; if (!none) A.prow()
        };
        A.prow = () => { $("#pl").insertAdjacentHTML("beforeend", `<div class="pr"><select class="in">${PL.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select><input class="in" type="number" min="0" step="any" placeholder="Qty" oninput="A.ptot()"><input class="in" type="number" min="0" step="any" placeholder="Cost each" oninput="A.ptot()"><button class="ib" onclick="this.parentNode.remove();A.ptot()">${ic("trash", 16)}</button></div>`) };
        A.ptot = () => { $("#ptot").textContent = money($$("#pl .pr").reduce((a, r) => { const i = r.querySelectorAll("input"); return a + (+i[0].value || 0) * (+i[1].value || 0) }, 0)) };
        A.buy = async () => { const items = $$("#pl .pr").map(r => { const i = r.querySelectorAll("input"); return { product_id: r.querySelector("select").value, qty: i[0].value, price: i[1].value } }); if (!items.length) throw Error("Add at least one item"); if (items.some(x => !(+x.qty > 0) || x.price === "")) throw Error("Enter quantity and cost price for every item"); const r = await api("purchases", "POST", { supplier_id: $("#sp").value, paid: $("#pp").value, items }); toast("Purchase saved, stock updated (" + money(r.total) + ")"); A.purchases() };
        /* dashboard + reports */
        const tabs = () => `<div class="tabs">${[["day", "Today"], ["week", "7 days"], ["month", "30 days"], ["year", "12 months"]].map(x => `<button class="${PER == x[0] ? "on" : ""}" onclick="A.${PAGE}('${x[0]}')">${x[1]}</button>`).join("")}</div>`;
        A.dash = async p => {
            if (p) PER = p; const r = await api("report?period=" + PER), h = new Date().getHours(), g = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening", mx = Math.max(1, ...r.trend.map(x => x.v));
            const st = (l, v, i, c, sub) => `<div class="card stat ${c}"><div class="si">${ic(i, 22)}</div><div><div class="mu">${l}</div><div class="sv cnt" data-v="${v}">${money(0)}</div><div class="mu sm">${sub}</div></div></div>`;
            $("#view").innerHTML = `<div class="ph"><div><h2>${g}, ${esc(USER)} 👋</h2><p class="mu">Here's how your store is doing ${PERLBL[PER]}.</p></div><div class="row g8 wrap"><button class="btn p" onclick="A.go('pos')">${ic("pos", 16)}New sale</button><button class="btn" onclick="A.go('products')">${ic("box", 16)}Products</button><button class="btn" onclick="A.go('purchases')">${ic("inbox", 16)}New purchase</button></div></div>${tabs()}
<div class="g4">${st("Total sales", r.sales, "chart", "c1", r.credit > 0 ? money(r.credit) + " on credit" : "Everything paid")}${st("Gross profit", r.gross, "wallet", "c2", "Sales minus cost of goods")}${st("Net profit", r.net, "dash", r.net < 0 ? "c4" : "c3", "After expenses")}${st("Udhaar outstanding", r.outstanding, "users", "c4", "Owed by customers")}</div>
<div class="g2 mt"><div class="card pad"><div class="ch"><h4>Sales — last 7 days</h4></div><div class="bars">${r.trend.map(x => `<div class="bc" title="${x.d}: ${money(x.v)}"><span class="bv">${x.v ? Math.round(x.v).toLocaleString() : ""}</span><div class="bw"><div class="bar" style="height:${Math.max(2, x.v / mx * 100)}%"></div></div><span class="bl">${x.d}</span></div>`).join("")}</div></div>
<div class="card pad"><div class="ch"><h4>Top selling products</h4></div>${r.top.map((x, i) => `<div class="li"><span class="rk">${i + 1}</span><div class="fx"><b>${esc(x.name)}</b><div class="mu sm">${x.qty} sold</div></div><b>${money(x.amt)}</b></div>`).join("") || empty("No sales in this period", "Complete a sale from POS Billing to see your best sellers.", "chart")}</div></div>
<div class="g2 mt"><div class="card pad"><div class="ch"><h4>Money in &amp; out</h4></div>${[["Purchases", r.purchases], ["Expenses", r.expenses], ["Cash received", r.cash], ["Credit sales", r.credit], ["Owed to suppliers", r.payable], ["Stock value", r.stock_value]].map(x => `<div class="li"><div class="fx mu">${x[0]}</div><b>${money(x[1])}</b></div>`).join("")}</div>
<div class="card pad"><div class="ch"><h4>${ic("warn", 16)} Low stock alerts <span class="bd wa">${r.low.length}</span></h4></div>${r.low.slice(0, 6).map(p => `<div class="li"><div class="fx"><b>${esc(p.name)}</b><div class="mu sm">Minimum ${p.min_stock} ${esc(p.unit || "")}</div></div><span class="bd ${p.stock <= 0 ? "er" : "wa"}">${p.stock <= 0 ? "Out of stock" : p.stock + " left"}</span></div>`).join("") || `<div class="empty sm">${ic("check", 28)}<p>All stock levels are healthy</p></div>`}</div></div>`; count()
        };
        A.reports = async p => {
            if (p) PER = p; const r = await api("report?period=" + PER), l = (a, v, c = "", b = "") => `<div class="li ${b}"><div class="fx">${a}</div><b class="${c}">${money(v)}</b></div>`;
            $("#view").innerHTML = `<div class="ph"><div><h2>Reports &amp; Export</h2><p class="mu">Profit &amp; loss for ${PERLBL[PER]}</p></div><button class="btn p" onclick="print()">${ic("print", 16)}Print / Save PDF</button></div>${tabs()}<div class="g2"><div class="card pad pa"><div class="ch"><h4>StoreTrak — Profit &amp; Loss</h4><span class="mu sm">${PERLBL[PER]}</span></div>${l("Total sales", r.sales)}${l("Cost of goods sold", -r.cogs)}${l("Gross profit", r.gross, r.gross < 0 ? "er" : "ok", "tot")}${l("Business expenses", -r.expenses)}${l("Net profit", r.net, r.net < 0 ? "er" : "ok", "tot")}<div class="sp"></div>${l("Cash received", r.cash)}${l("Credit sales", r.credit)}${l("Purchases made", r.purchases)}${l("Customer udhaar outstanding", r.outstanding)}${l("Owed to suppliers", r.payable)}${l("Current stock value", r.stock_value)}</div><div class="card pad"><div class="ch"><h4>Export to Excel (CSV)</h4></div><p class="mu">Download your records as CSV files that open directly in Excel.</p><div class="row g8 wrap mt">${["products", "sales", "purchases", "customers", "suppliers", "expenses"].map(t => `<a class="btn" href="/api/export/${t}?token=${T}">${ic("download", 16)}${t[0].toUpperCase() + t.slice(1)}</a>`).join("")}</div></div></div>`
        };
        Object.keys(A).forEach(k => { const f = A[k]; A[k] = (...a) => { try { const r = f(...a); return r && r.catch ? r.catch(e => toast(e.message, 0)) : r } catch (e) { toast(e.message, 0) } } });
        if (T && ROLE) A.start();
    </script>
</body>
