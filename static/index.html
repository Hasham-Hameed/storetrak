<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>StoreTrak — Smart Shop Management &amp; POS</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d9488'/%3E%3Cpath d='M8 22v-9l8-5 8 5v9' stroke='white' stroke-width='2.5' fill='none'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div id="login">
        <div class="hero">
            <div class="brand"><span class="logo"></span>StoreTrak</div>
            <h1>Run your whole shop from one smart screen.</h1>
            <p>Billing, stock, suppliers, udhaar and profit reports — all connected, all in real time.</p>
            <ul id="feat"></ul>
        </div>
        <div class="lf">
            <div class="lb2">
                <div class="brand dk" style="padding:0 0 22px"><span class="logo"></span>StoreTrak</div>
                <h3>Welcome back</h3>
                <p class="mu" style="margin-bottom:22px">Sign in to manage your store.</p>
                <label class="lb">Username</label><input id="u" class="in" autocomplete="username"><label
                    class="lb mt8">Password</label><input id="p" type="password" class="in"
                    autocomplete="current-password" onkeydown="if(event.key=='Enter')A.login()">
                <button id="lb" class="btn p lg" onclick="A.login()">Sign in</button>
                <div id="le" class="er sm mt8"></div>
                <p class="mu sm mt">Demo accounts: admin / admin123 · cashier / cashier123</p>
            </div>
        </div>
    </div>
    <div id="app" class="hide">
        <div id="sh" class="shade" onclick="A.menu()"></div>
        <aside id="side" class="side">
            <div class="brand"><span class="logo"></span>StoreTrak</div>
            <div id="nav" class="nav"></div>
            <div class="nav"><a onclick="A.logout()"></a></div>
        </aside>
        <div class="main">
            <div class="top"><button id="mn" class="ib" onclick="A.menu()"></button>
                <h3 id="pt" class="fx"></h3><span id="dt" class="mu sm"></span>
                <div class="user">
                    <div class="av sm" id="uav" style="background:var(--t)"></div>
                    <div><b id="un"></b><span id="ur" class="mu sm"></span></div>
                </div>
            </div>
            <div id="view" class="page"></div>
        </div>
    </div>
    <div id="ov" class="ov" onclick="if(event.target==this)A.close()">
        <div id="md" class="md">
            <div class="mh">
                <h4 id="mt"></h4><button class="ib" onclick="A.close()" id="mx"></button>
            </div>
            <div class="mb" id="mb"></div>
        </div>
    </div>
    <div id="toasts"></div>
<script src="/app.js"></script> 
</body>

</html>
